<div class="app-container" [class.animation-paused]="isPaused">
  <nav class="side-nav" [class.mobile-nav]="isMobile">
    <ul role="navigation" aria-label="Main navigation">
      <li>
        <a routerLink="" aria-label="Home" routerLinkActive="active" rel="expect"
          [routerLinkActiveOptions]="{exact: true}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/about" aria-label="About" routerLinkActive="active" rel="expect">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/projects" aria-label="Projects" routerLinkActive="active" rel="expect">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/dance" aria-label="Dance" routerLinkActive="active" rel="expect">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="2.5" />
            <circle cx="17.5" cy="15.5" r="2.5" />
            <path d="M8 17V5l12-2v12" />
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/contact" aria-label="Contact" routerLinkActive="active" rel="expect">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </li>
    </ul>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <label class="toggle-switch" role="switch" [attr.aria-checked]="!isPaused" tabindex="0"
    (keydown)="handleKeydown($event)">
    <input type="checkbox" [checked]="!isPaused" (change)="toggleAnimation()" aria-hidden="true">
    <span class="slider"></span>
    <span class="sr-only">
      {{isPaused ? 'Enable' : 'Disable'}} background animation
    </span>
  </label>

  <div class="bubble-container">
    <div *ngFor="let bubble of bubbles" class="bubble" [ngStyle]="getBubbleStyles(bubble)" aria-hidden="true">
    </div>
  </div>
</div>
