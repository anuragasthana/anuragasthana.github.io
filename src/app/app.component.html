<div class="app-container" [class.animation-paused]="isPaused">
  <nav class="side-nav" [class.mobile-nav]="isMobile">
    <ul role="navigation" aria-label="Main navigation">
      <li>
        <a routerLink="" aria-label="Home" routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/about" aria-label="About" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/projects" aria-label="Projects" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/dance" aria-label="Dance" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="2.5"/>
            <circle cx="17.5" cy="15.5" r="2.5"/>
            <path d="M8 17V5l12-2v12"/>
          </svg>
        </a>
      </li>
      <li>
        <a routerLink="/contact" aria-label="Contact" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </li>
    </ul>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <label class="toggle-switch" aria-label="Toggle background animation">
    <input type="checkbox" 
           [checked]="!isPaused" 
           (change)="toggleAnimation()"
           aria-label="Toggle animation"
           aria-pressed="!isPaused">
    <span class="slider"></span>
  </label>

  <div class="bubble-container">
    <div *ngFor="let bubble of bubbles" 
         class="bubble" 
         [ngStyle]="getBubbleStyles(bubble)"
         aria-hidden="true">
    </div>
  </div>
</div>
